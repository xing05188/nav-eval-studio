server:
  host: 0.0.0.0
  port: 8080
  open_browser: false

storage:
  work_dir: ./storage
  db_path: ./storage/eval.db
  artifact_keep_days: 90

scheduler:
  max_parallel_tasks: 2
  episode_timeout_s: 300
  poll_interval_ms: 500
  gpu_ids: []

security:
  token_ttl_hours: 12
  pbkdf2_iterations: 200000

logging:
  level: INFO
  keep_days: 30

demo:
  enabled: true
  sample_results_dir: ./storage/sample_results

import:
  # 历史评测产物根目录（其下形如 results/<实验名>/streamvln/result.json）
  results_root: /home/zjr/StreamVLN-kaggle-backup
  # 备份库自动导入根目录：启动时同步一次，之后监视目录变化做增量导入
  backup_root: /home/zjr/StreamVLN-kaggle-backup
  auto_enabled: true
  auto_interval_s: 300
  auto_sections: [datasets, scenes, models, results, assets]
  auto_scan_episodes: true
  # 单个数据集目录下 episode 文件总大小超过该值时只登记不解析，避免自动导入卡住
  scan_limit_mb: 32
  # 训练/大规模轨迹数据只登记路径，不自动解析 episode（可在数据集页手动扫描）
  scan_exclude: [train, envdrop, scalevln]
  # 结果文件在最近 N 秒内仍在写入时，导入任务标记为「运行中」
  running_grace_s: 600

sim:
  # Habitat 场景根目录（其下形如 mp3d/<scene_id>/<scene_id>.glb）。
  # 留空时按 episode.meta_json 的 raw_scene_id 与数据集的 scene_root 自动回退。
  scene_root: /home/zjr/StreamVLN-kaggle-backup/data/scene_datasets
  # 仿真使用的 GPU（第一张为默认），启动时只读一次显存用于预警
  # 本机约定：仿真与模型都压在 GPU2（14 GB 空闲够 仿真 4 GB + 8bit 权重 8.7 GB）
  gpu_ids: [2]
  # 动作节拍：4 Hz 仅用于后续的模型/自动策略，手动单步是即时生效的
  tick_hz: 4.0
  # 无人观看时的渲染上限
  render_hz: 15.0
  # 有浏览器在看画面时的渲染上限
  stream_hz: 20.0
  jpeg_quality: 82
  # 同时观看 MJPEG 的连接数上限
  # 浏览器同域最多 6 条长连接，刷新/重连几次就会占满；上限放宽并允许踢最老的僵尸
  max_clients: 8
  # 无状态请求超过该秒数自动停止会话（0 表示不超时）
  idle_timeout_s: 900
  # 剩余显存低于该值(MB)时在页面上给警告，但不阻止启动
  free_mem_warn_mb: 4096
  # 第三视角：多挂一路 320×240 俯视相机，画面里做成第一视角右上角的画中画。
  # 实测默认 15 fps 上限下开/不开都是 14.4 fps（解除上限后 55 vs 50 fps，差异在噪声内）；
  # 运行中的「画中画」开关只切显隐、不省渲染，真要省这一路就在会话启动前关掉
  pip: true
  # 会话录制：按该采样率把整帧 JPEG 落盘（0 = 不录制），导出 mp4 时再异步编码
  # 1120×480 的 JPEG 约 80 KB/帧，10 fps ≈ 48 MB/分钟；超出最大帧数后丢帧
  record_fps: 10.0
  record_max_frames: 6000
  # 机器狗网格：只在第三视角（画中画）里看得到，第一视角看不到它，不影响模型输入。
  # "go2" = 内置模型（backend/app/services/sim/assets/go2）；"" / "none" = 不显示；
  # 也可填 .object_config.json 或 .glb 的绝对路径（.glb 需要同目录有同名 object_config）
  robot_mesh: go2
  robot_scale: 1.0
  # 自定义模型如果车头不是朝 -Z，用这个角度（度）修正
  robot_yaw_deg: 0.0

# 模型驾驶（docs/08）。关掉 enabled 后 /api/sim/policy 直接 400，
# 手动驾驶与其余页面完全不受影响。
policy:
  enabled: true
  # 留空 = 取 models.yaml 里第一个 family=streamvln 的档案
  model_profile: ""
  # 模型推理用的卡；null = 自动挑空闲显存最多的一张
  gpu_id: 2
  # 启动前硬校验：实测 8bit 权重占 8.7 GB，留 ~3 GB 给 KV/激活
  min_free_mem_mb: 12000
  # 8 次 forward ≈ 32 个环境步做一次历史汇总（与评测 slow_update_interval 节奏一致）
  num_frames: 8
  num_history: 8
  # 一次 forward 出几个动作
  num_future_steps: 4
  # 单次 forward 超过该秒数判定失败并自动回手动
  infer_timeout_s: 30
  # 队列持续为空超过该秒数 → 自动暂停（省卡）
  idle_pause_s: 60
