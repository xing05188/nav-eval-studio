# 内置模型档案。软件首次建库时写入 model_profile 表，之后可在界面中修改。
# 路径按本机实际情况填写；address 为探测与调用入口。
profiles:
  - name: StreamVLN-R2R-RxR-v1.3
    family: streamvln
    code_path: /mnt/workspace/StreamVLN-kaggle-backup
    weights_path: /mnt/workspace/StreamVLN-kaggle-backup/checkpoints/StreamVLN_Video_qwen_1_5_r2r_rxr_envdrop_scalevln_v1_3
    entry: python -m streamvln.streamvln_eval
    needs_gpu: true
    allowed_inputs: [rgb, depth, pose, action]
    default_config:
      num_history: 8
      num_future_steps: 4
      slow_update_interval: 4
      prune_ratio: 0.35
      max_steps: 500
    description: 视频视觉语言导航基线模型，慢快双流上下文建模，支持深度反投影空间裁剪。

  - name: Mock-Demo
    family: mock
    code_path: ""
    weights_path: ""
    entry: backend.app.adapters.mock_adapter:MockAdapter
    needs_gpu: false
    allowed_inputs: [rgb, depth, pose, action]
    default_config:
      num_history: 8
      slow_update_interval: 4
      prune_ratio: 0.35
      max_steps: 500
    description: 离线演示适配器，读取预置结果生成可复现的评测记录，用于无 GPU 环境演示。
